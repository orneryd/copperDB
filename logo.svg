<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <!-- Rust-toned thread gradients -->
    <linearGradient id="threadGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C24A1A"/>
      <stop offset="100%" style="stop-color:#7A2E0F"/>
    </linearGradient>
    <linearGradient id="threadGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E05A20"/>
      <stop offset="100%" style="stop-color:#8B3310"/>
    </linearGradient>
    <!-- Gold accent gradient (kept from original) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a017"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <!-- Rust-orange radial for the nexus core -->
    <radialGradient id="rustCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF7B3A"/>
      <stop offset="100%" style="stop-color:#C24A1A"/>
    </radialGradient>
    <!-- Gear tooth pattern hint -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4641E" stop-opacity="0.5"/>
      <stop offset="100%" style="stop-color:#8B3310" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Outer gear ring - evokes Rust's systems-level engineering -->
  <circle cx="100" cy="90" r="85" fill="none" stroke="#C24A1A" stroke-width="2" opacity="0.15"/>
  <!-- Gear teeth around the outer ring -->
  <g opacity="0.2" fill="#D4641E">
    <rect x="96" y="2" width="8" height="10" rx="2"/>
    <rect x="96" y="168" width="8" height="10" rx="2"/>
    <rect x="12" y="86" width="10" height="8" rx="2"/>
    <rect x="178" y="86" width="10" height="8" rx="2"/>
    <rect x="33" y="29" width="9" height="8" rx="2" transform="rotate(45 37 33)"/>
    <rect x="158" y="29" width="9" height="8" rx="2" transform="rotate(-45 162 33)"/>
    <rect x="33" y="143" width="9" height="8" rx="2" transform="rotate(-45 37 147)"/>
    <rect x="158" y="143" width="9" height="8" rx="2" transform="rotate(45 162 147)"/>
  </g>

  <!-- Three Norns as interwoven threads/paths -->
  <!-- Urðr (Past) - Left thread -->
  <path d="M 40 140 
           Q 30 100 50 70 
           Q 70 40 100 35 
           Q 130 30 145 55
           Q 155 75 140 90"
        fill="none" 
        stroke="#C24A1A" 
        stroke-width="12" 
        stroke-linecap="round"
        opacity="0.9"/>

  <!-- Verðandi (Present) - Center/Top thread -->
  <path d="M 100 25 
           Q 100 50 85 75
           Q 70 100 85 120
           Q 100 140 100 165"
        fill="none" 
        stroke="#D4641E" 
        stroke-width="12" 
        stroke-linecap="round"/>

  <!-- Skuld (Future) - Right thread -->
  <path d="M 160 140 
           Q 170 100 150 70 
           Q 130 40 100 35 
           Q 70 30 55 55
           Q 45 75 60 90"
        fill="none" 
        stroke="#C24A1A" 
        stroke-width="12" 
        stroke-linecap="round"
        opacity="0.9"/>

  <!-- Inner copper highlights for depth -->
  <path d="M 42 138 
           Q 32 100 52 72 
           Q 72 44 100 39"
        fill="none" 
        stroke="#FF9E5E" 
        stroke-width="3" 
        stroke-linecap="round"
        opacity="0.2"/>

  <path d="M 158 138 
           Q 168 100 148 72 
           Q 128 44 100 39"
        fill="none" 
        stroke="#FF9E5E" 
        stroke-width="3" 
        stroke-linecap="round"
        opacity="0.2"/>

  <!-- Central nexus point - Rust-orange core with gold ring -->
  <circle cx="100" cy="85" r="12" fill="url(#rustCore)"/>
  <circle cx="100" cy="85" r="8" fill="#3B1508"/>
  <circle cx="100" cy="85" r="5" fill="url(#rustCore)"/>
  <!-- Tiny gear notches on the nexus -->
  <g opacity="0.45" fill="#FF7B3A">
    <rect x="98.5" y="72" width="3" height="4" rx="1"/>
    <rect x="98.5" y="94" width="3" height="4" rx="1"/>
    <rect x="87" y="83.5" width="4" height="3" rx="1"/>
    <rect x="109" y="83.5" width="4" height="3" rx="1"/>
  </g>

  <!-- Three small destiny nodes -->
  <circle cx="55" cy="65" r="5" fill="url(#goldGrad)" opacity="0.8"/>
  <circle cx="145" cy="65" r="5" fill="url(#goldGrad)" opacity="0.8"/>
  <circle cx="100" cy="140" r="5" fill="url(#goldGrad)" opacity="0.8"/>

  <!-- Connecting thread hints -->
  <line x1="60" y1="67" x2="93" y2="82" stroke="#d4a017" stroke-width="1.5" opacity="0.4"/>
  <line x1="140" y1="67" x2="107" y2="82" stroke="#d4a017" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="135" x2="100" y2="92" stroke="#d4a017" stroke-width="1.5" opacity="0.4"/>

  <!-- Text: copperDB -->
  <text x="100" y="200" 
        font-family="'Helvetica Neue', Arial, sans-serif" 
        font-size="28" 
        font-weight="700" 
        fill="#C24A1A" 
        text-anchor="middle"
        letter-spacing="3">copperDB</text>

  <!-- Tagline -->
  <text x="100" y="222" 
        font-family="'Helvetica Neue', Arial, sans-serif" 
        font-size="10" 
        font-weight="400" 
        fill="#C24A1A" 
        text-anchor="middle"
        letter-spacing="1.5"
        opacity="0.7">PSYGNOSIS FOR AI</text>
</svg>
