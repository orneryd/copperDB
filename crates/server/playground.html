<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>copperDB GraphQL Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        h1 { color: #e94560; }
        textarea { width: 100%; min-height: 200px; background: #16213e; color: #e0e0e0; border: 1px solid #0f3460; border-radius: 8px; padding: 1rem; font-family: monospace; font-size: 14px; }
        button { background: #e94560; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 1rem; }
        button:hover { background: #d63450; }
        pre { background: #16213e; padding: 1rem; border-radius: 8px; overflow-x: auto; min-height: 100px; }
        .error { color: #e94560; }
    </style>
</head>
<body>
    <div class="container">
        <h1>copperDB GraphQL</h1>
        <p>Query and mutate your graph database.</p>
        <textarea id="query" placeholder="Enter your GraphQL query...">{
  node(id: "example-1") {
    id
    labels
    properties
  }
}</textarea>
        <button onclick="executeQuery()">Execute</button>
        <h3>Response</h3>
        <pre id="response"></pre>
    </div>
    <script>
        async function executeQuery() {
            const query = document.getElementById('query').value;
            const respEl = document.getElementById('response');
            respEl.textContent = '...';
            try {
                const response = await fetch('/graphql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const data = await response.json();
                respEl.textContent = JSON.stringify(data, null, 2);
                if (data.errors) {
                    respEl.classList.add('error');
                } else {
                    respEl.classList.remove('error');
                }
            } catch (err) {
                respEl.textContent = 'Error: ' + err.message;
                respEl.classList.add('error');
            }
        }
    </script>
</body>
</html>
