nornicdbcli.root.long: |-
  NornicDB es una base de datos de grafos especializada escrita en Go,
  diseñada para la memoria de agentes de IA y compatible con Neo4j Bolt/Cypher.

  Funciones:
    • Compatibilidad con el protocolo Neo4j Bolt
    • Compatibilidad con el lenguaje de consultas Cypher
    • Puntuación de la capa de conocimiento con perfiles de decaimiento declarativos
    • Inferencia automática de relaciones
    • Búsqueda vectorial integrada con clasificación híbrida RRF
    • Generación de embeddings en el servidor
nornicdbcli.root.short: NornicDB - Base de datos de grafos de alto rendimiento para agentes LLM
