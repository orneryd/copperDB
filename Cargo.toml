[workspace]
resolver = "2"
members = [
    "crates/audit",
    "crates/auth",
    "crates/bolt",
    "crates/buildinfo",
    "crates/cache",
    "crates/compliance",
    "crates/config",
    "crates/convert",
    "crates/cypher",
    "crates/decay",
    "crates/embed",
    "crates/embeddingutil",
    "crates/encryption",
    "crates/errors",
    "crates/envutil",
    "crates/eval",
    "crates/fabric",
    "crates/filter",
    "crates/gpu",
    "crates/graphql",
    "crates/heimdall",
    "crates/indexing",
    "crates/knowledgepolicy",
    "crates/inference",
    "crates/kms",
    "crates/lifecycle",
    "crates/linkpredict",
    "crates/localllm",
    "crates/math",
    "crates/mcp",
    "crates/multidb",
    "crates/copperdb",
    "crates/engine",
    "crates/nornicgrpc",
    "crates/otel",
    "crates/pool",
    "crates/qdrantgrpc",
    "crates/replication",
    "crates/retention",
    "crates/search",
    "crates/security",
    "crates/server",
    "crates/simd",
    "crates/storage",
    "crates/temporal",
    "crates/textchunk",
    "crates/topology",
    "crates/txsession",
    "crates/util",
    "crates/vectorspace",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["copperdb contributors"]
license = "Apache-2.0"
repository = "https://github.com/orneryd/copperdb"

# Shared dependency versions across workspace
[workspace.dependencies]
# Async runtime
tokio = { version = "1.52.1", features = ["full"] }
tokio-stream = "0.1.18"
tokio-util = "0.7.18"
async-trait = "0.1.89"
futures = "0.3.31"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
rmp-serde = "1.3.1"          # MessagePack (replaces vmihailenco/msgpack)
toml = "1.1.2"

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.102"

# Logging / tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Cryptography (replaces golang.org/x/crypto)
aes-gcm = "0.11.0-rc.3"
chacha20poly1305 = "0.11.0-rc.3"
argon2 = "0.6.0-rc.8"
sha2 = "0.11.0"
hmac = "0.13.0"
zeroize = { version = "1.8.2", features = ["derive"] }

# UUIDs (replaces github.com/google/uuid)
uuid = { version = "1.15.1", features = ["v4", "serde"] }

# JWT (replaces github.com/golang-jwt/jwt)
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }

# HTTP client / server
reqwest = { version = "0.13.2", features = ["json", "stream"] }
axum = "0.8.9"
hyper = { version = "1.9.0", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }

# WebSocket (replaces github.com/gorilla/websocket)
tokio-tungstenite = "0.29.0"

# gRPC (replaces google.golang.org/grpc)
tonic = "0.14.5"
tonic-prost = "0.14.5"
prost = "0.14.3"
prost-types = "0.14.3"
tonic-build = "0.14.5"
tonic-prost-build = "0.14.5"

# GraphQL (replaces github.com/99designs/gqlgen)
async-graphql = "8.0.0-rc.4"
async-graphql-axum = "8.0.0-rc.4"

# Storage engine (replaces github.com/dgraph-io/badger)
sled = "1.0.0-alpha.124"

# Configuration (replaces github.com/spf13/cobra / gopkg.in/yaml.v3)
clap = { version = "4.6.1", features = ["derive"] }
config = "0.15.22"

# Graph algorithms (for linkpredict, indexing)
petgraph = "0.8.3"

# Numeric / linear algebra
nalgebra = "0.34.2"
ndarray = "0.17.2"

# SIMD / vectorized math (replaces github.com/viterin/vek)
wide = "1.3.0"

# Full-text search (replaces Bleve / custom search)
tantivy = "0.26.0"
regex = "1.12.2"

# Bytes / encoding utilities
bytes = "1.11.1"
base64 = "0.22.1"
hex = "0.4.3"
getrandom = "0.4.2"

# Hashing (replaces hash/fnv in Go std)
fnv = "1.0.7"
twox-hash = "2.1.2"

# Concurrency primitives
parking_lot = "0.12.5"
dashmap = "7.0.0-rc2"

# Dynamic library loading (replaces github.com/ebitengine/purego FFI)
libloading = "0.9.0"

# KMS provider clients
aws-config = "1.8.16"
aws-sdk-kms = "1.105.0"

# OAuth2 (replaces auth OAuth flows)
oauth2 = "5.0.0"
tempfile = "3.27.0"
url = "2.5.4"

# Inter-crate dependencies within this workspace
copperdb-util = { path = "crates/util" }
copperdb-storage = { path = "crates/storage" }
copperdb-cypher = { path = "crates/cypher" }
copperdb-auth = { path = "crates/auth" }
copperdb-encryption = { path = "crates/encryption" }
copperdb-errors = { path = "crates/errors" }
copperdb-cache = { path = "crates/cache" }
copperdb-simd = { path = "crates/simd" }
copperdb-vectorspace = { path = "crates/vectorspace" }
copperdb-decay = { path = "crates/decay" }
copperdb-temporal = { path = "crates/temporal" }
copperdb-indexing = { path = "crates/indexing" }
copperdb-knowledgepolicy = { path = "crates/knowledgepolicy" }
copperdb-replication = { path = "crates/replication" }
copperdb-bolt = { path = "crates/bolt" }
copperdb-embed = { path = "crates/embed" }
copperdb-gpu = { path = "crates/gpu" }
copperdb-kms = { path = "crates/kms" }
copperdb-lifecycle = { path = "crates/lifecycle" }
copperdb-config = { path = "crates/config" }
copperdb-server = { path = "crates/server" }
copperdb-graphql = { path = "crates/graphql" }
copperdb-pool = { path = "crates/pool" }
copperdb-txsession = { path = "crates/txsession" }
copperdb-eval = { path = "crates/eval" }
copperdb-filter = { path = "crates/filter" }
copperdb-math = { path = "crates/math" }
copperdb-search = { path = "crates/search" }
copperdb-audit = { path = "crates/audit" }
copperdb-compliance = { path = "crates/compliance" }
copperdb-security = { path = "crates/security" }
copperdb-heimdall = { path = "crates/heimdall" }
copperdb-fabric = { path = "crates/fabric" }
copperdb-multidb = { path = "crates/multidb" }
copperdb-mcp = { path = "crates/mcp" }
copperdb-inference = { path = "crates/inference" }
copperdb-localllm = { path = "crates/localllm" }
copperdb-engine = { path = "crates/engine" }
copperdb-linkpredict = { path = "crates/linkpredict" }
copperdb-embeddingutil = { path = "crates/embeddingutil" }
copperdb-textchunk = { path = "crates/textchunk" }
copperdb-topology = { path = "crates/topology" }
copperdb-retention = { path = "crates/retention" }
copperdb-convert = { path = "crates/convert" }
copperdb-envutil = { path = "crates/envutil" }
copperdb-buildinfo = { path = "crates/buildinfo" }
